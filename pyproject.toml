# EVIDENCE-MANIFEST-TOOLKIT — source and configuration provenance

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tools", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["local_scaffold"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "tools"
explicit_package_bases = true
files = ["tools", "tests"]
cache_dir = ".tool-cache/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["tools"]
parallel = true
sigterm = true
data_file = ".tool-cache/coverage/data"

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2

[tool.coverage.paths]
source = ["tools"]
