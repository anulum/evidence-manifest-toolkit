# EVIDENCE-MANIFEST-TOOLKIT — source and configuration provenance

name: pre-commit
on:
  workflow_call:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-pre-commit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Validate local infrastructure
        run: make quality
  tests:
    name: Infrastructure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.18"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Fetch the pinned environment inputs
        run: make fetch-environment-inputs
      - name: Install the complete hash-locked development graph
        run: make environment
      - name: Prepare the pinned native fixtures and actual audit input
        run: make prepare-test-inputs
      - name: Provide the host clock sample the clock tests read
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends systemd-timesyncd
          sudo mkdir -p /etc/systemd/timesyncd.conf.d
          conf=/etc/systemd/timesyncd.conf.d/hold-one-sample.conf
          printf '[Time]\nPollIntervalMinSec=2048\nPollIntervalMaxSec=2048\n' | sudo tee "$conf"
          sudo systemctl restart systemd-timesyncd
          manager=(org.freedesktop.timesync1 /org/freedesktop/timesync1 org.freedesktop.timesync1.Manager)
          for attempt in $(seq 120); do
            reply=$(busctl --system get-property "${manager[@]}" NTPMessage 2>/dev/null || true)
            read -r -a sample <<< "$reply"
            if [ "${#sample[@]}" -eq 20 ] && [ "${sample[17]}" = false ] && [ "${sample[16]}" != 0 ]; then
              echo "clock sample ready after ${attempt} s"
              exit 0
            fi
            sleep 1
          done
          echo "no clock sample that is not ignored"
          exit 1
      - name: Validate local infrastructure
        env:
          TEST_WORKERS: "4"
        run: make test
