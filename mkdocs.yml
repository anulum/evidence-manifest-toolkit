# EVIDENCE-MANIFEST-TOOLKIT — source and configuration provenance

site_name: Evidence Manifest Toolkit
site_description: Local repository validation and evidence runtime development
strict: true
site_dir: .tool-cache/site
exclude_docs: |
  /internal/
watch: [tools, src]
theme:
  name: material
  custom_dir: overrides
  logo: assets/anulum_logo.png
  favicon: assets/anulum_logo.png
nav:
  - Overview: index.md
  - Architecture: ARCHITECTURE.md
  - Python API: api.md
  - Offline CLI: offline-cli.md
  - Validation tooling: validation-tooling.md
  - Threat model: THREAT_MODEL.md
  - Repository boundary: adr/0001-repository-boundary.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [tools, src]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            members_order: source
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
